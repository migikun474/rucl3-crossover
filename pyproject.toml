[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rucl3"
version = "0.1.0"
description = "Quantum-classical crossover for the neutron spectrum of alpha-RuCl3"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "numba>=0.59",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
mps = ["physics-tenpy>=1.0"]
quantum = ["qdk>=1.30"]
hardware = ["qiskit>=2.0", "qiskit-aer>=0.17", "qiskit-ibm-runtime>=0.40"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["rucl3*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning:rucl3.model.params"]
